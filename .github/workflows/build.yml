name: build

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile and package
        run: |
          mkdir -p build/classes
          find src -name '*.java' > build/sources.txt
          javac --release 8 -encoding UTF-8 -d build/classes @build/sources.txt
          jar --create --file TextAdventure.jar --main-class Main -C build/classes .

      - name: Smoke test jar
        run: printf 'quit\n' | java -jar TextAdventure.jar

      - uses: actions/upload-artifact@v4
        with:
          name: TextAdventure
          path: TextAdventure.jar

      - name: Attach jar to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: TextAdventure.jar
